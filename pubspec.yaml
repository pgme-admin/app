name: pgme
description: Post Graduate Medical Education - A complete medical education platform
publish_to: 'none'
version: 2.0.8+39

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  go_router: ^13.0.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  intl_phone_field: ^3.2.0
  flutter_svg: ^2.0.9
  sendotp_flutter_sdk: ^0.0.2
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  json_annotation: ^4.8.1
  device_info_plus: ^11.0.0
  package_info_plus: ^9.0.0
  url_launcher: ^6.2.2
  cached_network_image: ^3.3.0
  smart_auth: ^3.2.0
  pinput: ^6.0.0
  # razorpay_flutter: ^1.3.7  # Replaced with Zoho Payments via WebView
  webview_flutter: ^4.5.0
  flutter_dotenv: ^5.1.0
  flutter_zoom_meeting_sdk:
    path: packages/flutter_zoom_meeting_sdk
  # Local patch: iOS must persist playback speed while paused by updating
  # AVPlayer.defaultRate as well as the live rate.
  better_player_plus:
    path: vendor/better_player_plus
  geolocator: ^9.0.2
  permission_handler: ^12.0.1
  shimmer: ^3.0.0
  path_provider: ^2.1.2
  syncfusion_flutter_pdfviewer: ^28.1.33
  # Text extraction for placing saved highlights (already pulled in by the
  # viewer at the same version; declared because the reader imports it).
  syncfusion_flutter_pdf: ^28.2.12
  flutter_epub_viewer: ^1.2.8
  # Web view the EPUB reader runs in (already pulled in by flutter_epub_viewer
  # at this version); declared because the reader takes page stills with it.
  flutter_inappwebview: ^6.1.5
  pdfrx: ^1.0.100
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  font_awesome_flutter: ^11.0.0
  flutter_local_notifications: ^19.4.1
  no_screenshot: ^0.10.0
  flutter_widget_from_html_core: ^0.17.0
  wakelock_plus: ^1.2.8
  background_downloader: ^9.0.0
  file_picker: ^8.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

# Vendored pdfrx with a single-line patch removing the `enabled` guard in
# pdf_page_text_overlay.dart's dispatchSelectionEvent. Without it,
# zoomed-in text selection is dropped because pdfrx flags every touch as
# an InteractiveViewer interaction. See vendor/pdfrx for the patched
# source (vendor/pdfrx/lib/src/widgets/pdf_page_text_overlay.dart line
# ~423). Remove this override only when upstream pdfrx ships a fix.
dependency_overrides:
  pdfrx:
    path: vendor/pdfrx
  # Vendored flutter_epub_viewer 1.2.8, patched so the book reaches the web
  # view in base64 pieces instead of one giant JS array literal (a 46 MB
  # EPUB made a 172 MB script; iOS killed the web view and the app). See the
  # "PGME patch" comments in vendor/flutter_epub_viewer/lib/src/epub_viewer.dart
  # and lib/assets/webpage/html/epubView.js.
  flutter_epub_viewer:
    path: vendor/flutter_epub_viewer

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo1.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo1.png"

flutter:
  # iOS: integrate plugins via CocoaPods, not Swift Package Manager. With SwiftPM,
  # pdfrx (vendor/pdfrx) is linked statically and its Dart loader cannot find the
  # pdfium symbols (no pdfrx.framework), so every PDF fails with "Failed to load
  # PDF" on iOS. CocoaPods builds pdfrx as a dynamic framework, which works.
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - .env
    - assets/zoho_payment.html
    - shorebird.yaml

  shaders:
    - shaders/page_curl.frag

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/Inter-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
